(function() {

    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  // ----- Parser -----
  function Parser(input) {
    this.src = input;
    this.pos = 0;
  }

  Parser.prototype.eof = function() { return this.pos >= this.src.length; };
  Parser.prototype.peek = function() { return this.src[this.pos]; };
  Parser.prototype.advance = function() { return this.src[this.pos++]; };

  Parser.prototype.skipWS = function() {
    while (!this.eof() && /\s/.test(this.peek())) this.pos++;

  Parser.prototype.readGroup = function() {
    this.skipWS();
    if (this.peek() !== '{') return '';
    this.pos++; // skip {
    var depth = 1, start = this.pos;
    while (!this.eof() && depth > 0) {
      var ch = this.peek();
      if (ch === '{') depth++;
      if (ch === '}') depth--;
      if (depth > 0) this.pos++;

    var content = this.src.slice(start, this.pos);
    if (this.peek() === '}') this.pos++;
    return content;
  };

  Parser.prototype.readCommandName = function() {
    this.pos++; // skip \
    // Handle \\ (double backslash = line break)
    if (!this.eof() && this.peek() === '\\') { this.pos++; return '\\\\'; }
    var start = this.pos;
    while (!this.eof() && /[a-zA-Z@*]/.test(this.peek())) this.pos++;
    return this.src.slice(start, this.pos);
  };

  Parser.prototype.readUntil = function(stopChars) {
    var out = '';
    while (!this.eof() && stopChars.indexOf(this.peek()) === -1) {
      out += this.advance();
    }
    return out.trim();
  };

  // Parse inline content (text + nested commands like \textbf, \href, etc.)
  Parser.prototype.parseInline = function(raw) {
    var saveSrc = this.src;
    var savePos = this.pos;
    this.src = raw;
    this.pos = 0;
    var result = this._parseInlineContent();
    this.src = saveSrc;
    this.pos = savePos;
    return result;

  Parser.prototype._parseInlineContent = function() {
    var out = '';
    while (!this.eof()) {
      var ch = this.peek();
      if (ch === '\\') {
        var cmd = this.readCommandName();
        this.skipWS();
        switch (cmd) {
          case 'href': {
            var url = this.readGroup();
            var text = this.readGroup();
            out += '<a href="' + escapeHTML(url) + '" target="_blank" rel="noopener">' + this.parseInline(text) + '</a>';
            break;
          }
          case 'textbf': {
            out += '<strong>' + this.parseInline(this.readGroup()) + '</strong>';
            break;
          }
          case 'textit': {
            out += '<em>' + this.parseInline(this.readGroup()) + '</em>';
            break;
          }
          case 'underline': {
            out += '<u>' + this.parseInline(this.readGroup()) + '</u>';
            break;
          }
          case 'textcolor': {
            var color = this.readGroup();
            out += '<span class="resume-' + color + '">' + this.parseInline(this.readGroup()) + '</span>';
            break;
          }
          case 'small': {
            out += '<span class="resume-small">';
            break;
          }
          case 'scshape': {
            out += '<span class="resume-sc">';
            break;
          }
          case 'textperiodcentered': {
            out += ' · ';
            break;
          }
          case 'vspace': {
            this.readGroup();
            break;
          }
          case 'pagenumbering': {
            this.readGroup();
            break;
          }
          default:
            break;
        }
      } else if (ch === '$') {
        this.pos++;
        var start2 = this.pos;
        while (!this.eof() && this.peek() !== '$') this.pos++;
        var mathContent = this.src.slice(start2, this.pos);
        if (this.peek() === '$') this.pos++;
        out += '<span class="resume-math">' + escapeHTML('$' + mathContent + '$') + '</span>';
      } else if (ch === '{' || ch === '}') {
        this.pos++;
      } else if (ch === '\n') {
        this.pos++;
        out += ' ';
      } else {

  // Render an inline command (textbf, href, textcolor, small, etc.) into HTML
  Parser.prototype.renderInlineCmd = function(cmd) {
    switch (cmd) {

      case 'textit':
        return '<em>' + this.parseInline(this.readGroup()) + '</em>';
      case 'underline':
        return '<u>' + this.parseInline(this.readGroup()) + '</u>';
      case 'href':

        var linkText = this.readGroup();
        return '<a href="' + escapeHTML(url) + '" target="_blank" rel="noopener">' + this.parseInline(linkText) + '</a>';
      case 'textcolor':
        var clr = this.readGroup();
        return '<span class="resume-' + clr + '">' + this.parseInline(this.readGroup()) + '</span>';
      case 'small':
        return '<span class="resume-small">';
      case 'scshape':
        return '<span class="resume-sc">';
      case 'textperiodcentered':

      case '\\':  // double-backslash line break

        this.readGroup();
        return '';
      case 'pagenumbering':

        return '';

          continue;

        if (ch === '}') {

          continue;

        raw = raw.trim();
        if (raw) {

        continue;

      // Save position in case we need to un-read
      var savedPos = this.pos;
      var cmd = this.readCommandName();

      // Check stop conditions
      if (stopSet.indexOf(cmd) !== -1) {

        return out;

            if (this.peek() === ']') depth--;

        var itemContent = this.parseBody('item,end');
        out += '<li>' + itemContent + '</li>';

          break;
        case 'basicInfo':

          break;

          break;
